name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python smoke dependencies
        run: python -m pip install --upgrade pytest pyTelegramBotAPI requests pysocks

      - name: Python compile
        run: python -m compileall -q .

      - name: Python smoke
        run: python -m pytest tests/smoke_modules.py tests/test_multiple_subscriptions.py tests/test_proxy_share_parameters.py tests/test_update_cleanup.py tests/test_router_storage_kind.py tests/test_ipset_batch_parser.py tests/test_dns_route_generator.py tests/test_telegram_emergency_guard.py tests/test_router_health_cache.py tests/test_metrics_retention.py tests/test_cross_route_domains.py tests/test_proxy_apply_plan.py tests/test_proxy_apply_coordinator.py tests/test_proxy_apply_attestation.py tests/test_proxy_apply_state.py tests/test_xray_live_adapter.py tests/test_proxy_live_runtime.py tests/test_proxy_control_integration.py -q

      - name: Xray routing integration
        run: |
          curl -fsSL --retry 2 https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip -o "$RUNNER_TEMP/xray.zip"
          unzip -p "$RUNNER_TEMP/xray.zip" xray > "$RUNNER_TEMP/xray"
          chmod 700 "$RUNNER_TEMP/xray"
          XRAY_TEST_BINARY="$RUNNER_TEMP/xray" python -m pytest tests/test_cross_route_domains.py -q -k real_xray
          XRAY_TEST_BINARY="$RUNNER_TEMP/xray" python -m pytest tests/test_xray_live_apply.py -q
          XRAY_TEST_BINARY="$RUNNER_TEMP/xray" python -m pytest tests/test_route_egress.py -q

      - name: Route diagnostics
        run: python -m pytest tests/test_route_quality.py tests/test_route_profiles.py tests/test_route_probe_runtime.py tests/test_route_diagnostics_runtime.py tests/test_route_diagnostics_service.py -q

      - name: Whole route list transfer
        run: python -m pytest tests/test_route_list_move.py tests/test_route_dns_batch.py tests/test_manual_key_policy.py tests/test_web_pool_reads.py -q

      - name: Pool quality display
        run: python -m pytest tests/test_pool_quality_display.py -q

      - name: Protocol-owned services and Hysteria hot apply
        run: |
          python -m pytest tests/test_proxy_live_services.py -q
          curl -fsSL --retry 2 https://github.com/HyNetworks/hysteria/releases/download/app/v2.12.3/hysteria-linux-amd64 -o "$RUNNER_TEMP/hysteria"
          printf '8c7a68a906998b747a0db87586e364f995fbfddb95693ae6e2fdb68a6e920d3e  %s\n' "$RUNNER_TEMP/hysteria" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/hysteria"
          XRAY_TEST_BINARY="$RUNNER_TEMP/xray" HYSTERIA_TEST_BINARY="$RUNNER_TEMP/hysteria" python -m pytest tests/test_xray_hot_hysteria.py -q

      - name: YouTube failover receive evidence
        run: python -m pytest tests/test_youtube_stream_evidence.py -q

      - name: Secret scan
        run: python tests/secret_scan.py

      - name: First installation contracts (separate from update and rollback)
        run: |
          python -m pytest tests/test_install_bootstrap.py tests/test_installer_handover.py -q
          sudo apt-get update -qq
          sudo apt-get install -y busybox-static
          BYPASS_TEST_SHELL="/usr/bin/busybox ash" python -m pytest tests/test_install_bootstrap.py -q
          python -m pip install --target "$RUNNER_TEMP/install-deps" pyTelegramBotAPI==4.29.1 requests==2.32.5 PySocks==1.7.1 aiohttp==3.12.15
          for scenario in existing missing-asset fresh; do
            sudo python3 tests/install_sandbox.py --repo "$GITHUB_WORKSPACE" --busybox /usr/bin/busybox --dependencies "$RUNNER_TEMP/install-deps" --scenario "$scenario"
          done
          sudo python3 tests/install_sandbox.py --repo "$GITHUB_WORKSPACE" --busybox /usr/bin/busybox --dependencies "$RUNNER_TEMP/install-deps" --shell bash

      - name: Shell syntax
        run: |
          for script in \
            script.sh \
            bootstrap/install.sh \
            app/update_fork.sh \
            app/unblock_update.sh \
            app/unblock.dnsmasq \
            app/unblock_ipset.sh \
            app/100-ipset.sh \
            app/100-redirect.sh \
            app/S99telegram_bot \
            app/S98telegram_bot_installer \
            app/S99unblock
          do
            bash -n "$script"
          done

      - name: JavaScript syntax
        run: npm run ui:check

      - name: Install UI smoke dependencies
        run: |
          npm install
          npm run ui:install-browsers

      - name: UI smoke
        run: |
          python -u tests/ui_fixture_server.py --host 127.0.0.1 --port 18765 > /tmp/ui-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" || true; cat /tmp/ui-fixture.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18765/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18765/ > /dev/null
          BYPASS_UI_URL=http://127.0.0.1:18765/ npm run ui:smoke
          npm run ui:diagnostics
          npm run ui:quality
